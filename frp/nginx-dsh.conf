# Nginx 反向代理配置示例 — 放在 VPS 上
# /etc/nginx/sites-available/dsh.conf  →  ln -s 到 sites-enabled
#
# 作用：HTTPS + Basic Auth，挡在 FRP 映射端口 (7001) 前面，
#       避免把代码执行能力裸暴露到公网。
#
# 生成密码文件: sudo htpasswd -c /etc/nginx/.htpasswd 你的用户名
# 签发证书:     certbot --nginx -d dsh.example.com

server {
    listen 443 ssl;
    server_name dsh.example.com;   # 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;

    auth_basic           "dsh";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # dsh 用 SSE/WebSocket 推送事件流：支持 upgrade + 长连接超时
    location / {
        proxy_pass         http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;          # 透传原始 Host 给信任栅栏
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
